<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#d4001a">
<title>Rossmann Watch</title>
<style>
  :root { --red:#d4001a; --bg:#f5f3f1; --card:#fff; --ink:#1d1d1f; --mute:#77736f; --ok:#0a8a4a; --line:#e7e3df; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); padding-bottom:env(safe-area-inset-bottom); }
  header { background:var(--red); color:#fff; padding:calc(14px + env(safe-area-inset-top)) 16px 14px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:5; }
  header h1 { font-size:18px; margin:0; flex:1; letter-spacing:.2px; }
  header small { opacity:.85; font-size:12px; }
  header button { background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:8px; padding:6px 10px; font-size:14px; }
  nav { display:flex; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:calc(52px + env(safe-area-inset-top)); z-index:4; }
  nav button { flex:1; border:0; background:none; padding:12px 0; font-size:15px; color:var(--mute); border-bottom:3px solid transparent; }
  nav button.on { color:var(--red); border-color:var(--red); font-weight:600; }
  main { padding:12px; max-width:720px; margin:0 auto; }
  .row { display:flex; gap:8px; margin-bottom:12px; }
  input { flex:1; font-size:16px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; min-width:0; }
  .btn { border:0; border-radius:10px; padding:0 14px; font-size:15px; font-weight:600; background:var(--red); color:#fff; white-space:nowrap; }
  .btn.ghost { background:#fff; color:var(--red); border:1px solid var(--line); }
  .card { background:var(--card); border-radius:12px; padding:10px; display:flex; gap:10px; margin-bottom:8px; align-items:center; box-shadow:0 1px 0 var(--line); }
  .card img { width:64px; height:64px; object-fit:contain; flex:none; background:#fff; }
  .card .t { flex:1; min-width:0; }
  .card .n { font-weight:600; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .card .m { color:var(--mute); font-size:13px; margin-top:2px; }
  .price { color:var(--red); font-weight:700; }
  .old { color:var(--mute); text-decoration:line-through; font-size:13px; margin-left:4px; }
  .tag { display:inline-block; font-size:12px; font-weight:600; padding:2px 7px; border-radius:6px; margin-top:4px; }
  .tag.sale { background:#e6f6ee; color:var(--ok); }
  .tag.none { background:#f0eeec; color:var(--mute); }
  .tag.end { background:#fff1e0; color:#b45a00; }
  .icon { border:0; background:none; font-size:20px; padding:6px; color:var(--mute); flex:none; }
  .icon.add { color:var(--red); font-size:26px; }
  .empty { text-align:center; color:var(--mute); padding:30px 10px; }
  .hint { color:var(--mute); font-size:13px; margin:-4px 2px 12px; }
  #settings { background:#fff; border-radius:12px; padding:14px; margin-bottom:12px; display:none; }
  #settings label { display:block; font-size:13px; color:var(--mute); margin:8px 0 4px; }
  #settings input { width:100%; }
  #toast { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#1d1d1f; color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; }
  #toast.show { opacity:1; }
  a { color:inherit; text-decoration:none; }
</style>
</head>
<body>
<header>
  <h1>Rossmann Watch<br><small id="updated">…</small></h1>
  <button id="gear">⚙︎</button>
</header>
<nav>
  <button data-tab="mine" class="on">Moje</button>
  <button data-tab="promos">Promocje</button>
</nav>
<main>
  <section id="settings">
    <b>Ustawienia</b>
    <label>GitHub token (fine-grained, Contents: read &amp; write na to repo)</label>
    <input id="token" type="password" autocomplete="off" placeholder="github_pat_…">
    <label>Repo (owner/name)</label>
    <input id="repo" placeholder="owner/rossmann-watch">
    <div class="row" style="margin-top:12px"><button class="btn" id="saveSettings" style="padding:11px 14px">Zapisz</button></div>
  </section>

  <section id="tab-mine">
    <div class="row">
      <input id="addInput" placeholder="Link z rossmann.pl albo słowa, np. schauma for men">
      <button class="btn" id="addBtn">Dodaj</button>
    </div>
    <p class="hint">Link = dokładnie ten produkt. Słowa = każdy produkt w promocji, który zawiera wszystkie te słowa.</p>
    <div id="mineList"></div>
  </section>

  <section id="tab-promos" hidden>
    <div class="row"><input id="search" placeholder="Szukaj w aktualnych promocjach…"></div>
    <div id="promoList"></div>
  </section>
</main>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const LS = { get:k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
             set:(k,v) => { try { localStorage.setItem(k, v); } catch {} } };
const norm = s => (s||'').toLowerCase().replace(/ł/g,'l').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const zl = n => n == null ? '' : n.toFixed(2).replace('.', ',') + ' zł';
const plDate = iso => iso ? iso.slice(8,10) + '.' + iso.slice(5,7) : '';
const plural = (n, one, few, many) => n === 1 ? one : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? few : many;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayIso = () => new Intl.DateTimeFormat('en-CA', { timeZone:'Europe/Warsaw' }).format(new Date());
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }

let promos = [], watchlist = [], sha = null;

function defaultRepo() {
  const owner = location.hostname.endsWith('.github.io') ? location.hostname.split('.')[0] : '';
  const name = location.pathname.split('/').filter(Boolean)[0] || '';
  return owner && name ? `${owner}/${name}` : '';
}
const repo = () => LS.get('repo') || defaultRepo();
const token = () => LS.get('token');

function matches(w, p) {
  if (w.id) return Number(w.id) === p.id;
  const terms = norm(w.query).split(' ').filter(Boolean);
  const hay = norm(p.brand + ' ' + p.name);
  return terms.length && terms.every(t => hay.includes(t));
}

// ---- GitHub storage ----
const b64enc = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')), c => c.charCodeAt(0)));
async function gh(path, opts = {}) {
  const r = await fetch(`https://api.github.com/repos/${repo()}/contents/${path}`, {
    ...opts, headers: { 'Authorization': `Bearer ${token()}`, 'Accept': 'application/vnd.github+json', ...(opts.headers||{}) }
  });
  if (!r.ok) throw new Error(`GitHub ${r.status}`);
  return r.json();
}
async function loadWatchlist() {
  if (token() && repo()) {
    try { const f = await gh('watchlist.json'); sha = f.sha; watchlist = JSON.parse(b64dec(f.content)); return; }
    catch (e) { toast('Nie mogę odczytać z GitHuba: ' + e.message); }
  }
  try { watchlist = await fetch('watchlist.json', { cache:'no-store' }).then(r => r.json()); } catch { watchlist = []; }
}
async function saveWatchlist(msg) {
  if (!token() || !repo()) { $('#settings').style.display = 'block'; toast('Najpierw wpisz token GitHuba'); throw new Error('no token'); }
  const body = { message: msg, content: b64enc(JSON.stringify(watchlist, null, 1) + '\n'), sha };
  const r = await gh('watchlist.json', { method:'PUT', body: JSON.stringify(body) });
  sha = r.content.sha;
  toast('Zapisane ✓ — sprawdzam promocje w tle');
}

// ---- add / remove ----
function parseInput(raw) {
  const s = raw.trim();
  const m = s.match(/rossmann\.pl\/Produkt\/[^/]+\/([^,?#]+),(\d+)/i);
  if (m) return { id: Number(m[2]), label: decodeURIComponent(m[1]).replace(/-/g, ' ') };
  if (/^\d{4,}$/.test(s)) return { id: Number(s), label: `Produkt ${s}` };
  return s ? { query: s, label: s } : null;
}
async function addItem(item) {
  const dup = watchlist.some(w => (item.id && w.id === item.id) || (item.query && norm(w.query) === norm(item.query)));
  if (dup) { toast('Już jest na liście'); return; }
  watchlist.push(item);
  render();
  try { await saveWatchlist(`watch: ${item.label}`); } catch { watchlist.pop(); render(); }
}
async function removeItem(idx) {
  const [gone] = watchlist.splice(idx, 1);
  render();
  try { await saveWatchlist(`unwatch: ${gone.label}`); } catch { watchlist.splice(idx, 0, gone); render(); }
}

// ---- render ----
function statusTag(p) {
  if (!p) return '';
  const left = p.to ? Math.round((Date.parse(p.to) - Date.parse(todayIso())) / 864e5) : null;
  if (left != null && left < 0) return `<span class="tag none">Skończyła się ${plDate(p.to)}</span>`;
  if (left != null && left <= 2) return `<span class="tag end">Kończy się ${plDate(p.to)}</span>`;
  return `<span class="tag sale">Promo${p.to ? ' do ' + plDate(p.to) : ''}</span>`;
}
function priceHtml(p) {
  return `<span class="price">${zl(p.price)}</span>${p.oldPrice ? `<span class="old">${zl(p.oldPrice)}</span>` : ''}`
    + (!p.oldPrice && p.deal ? `<div class="m">${esc(p.deal.split('.')[0])}</div>` : '');
}
function productCard(p, right) {
  return `<div class="card"><a href="${esc(p.url)}" target="_blank" rel="noopener"><img src="${esc(p.img||'')}" alt="" loading="lazy"></a>
    <a class="t" href="${esc(p.url)}" target="_blank" rel="noopener"><div class="n">${esc(p.brand)} ${esc(p.name)}</div>
    <div class="m">${esc(p.unit)}</div>${priceHtml(p)}<div>${statusTag(p)}</div></a>${right}</div>`;
}
function renderMine() {
  const el = $('#mineList');
  if (!watchlist.length) { el.innerHTML = '<div class="empty">Pusto. Dodaj link do produktu albo słowa,<br>albo wybierz z zakładki Promocje.</div>'; return; }
  const onSale = [], off = [];
  watchlist.forEach((w, idx) => {
    const hits = promos.filter(p => matches(w, p));
    (hits.length ? onSale : off).push({ w, idx, hits });
  });
  const del = idx => `<button class="icon" data-del="${idx}" title="Usuń">✕</button>`;
  el.innerHTML =
    onSale.map(({ w, idx, hits }) => hits.slice(0, 6).map((p, j) => productCard(p, j === 0 ? del(idx) : '<span style="width:32px"></span>')).join('')
      + (w.query && hits.length > 1 ? `<div class="hint">„${esc(w.query)}”: ${hits.length} ${plural(hits.length, 'pasujący', 'pasujące', 'pasujących')} w promocji</div>` : '')).join('')
    + off.map(({ w, idx }) => `<div class="card"><div class="t"><div class="n">${esc(w.label)}</div>
        <div class="m">${w.id ? 'produkt' : 'słowa'}</div><span class="tag none">Nie w promocji</span></div>${del(idx)}</div>`).join('');
}
function renderPromos() {
  const q = norm($('#search').value);
  const el = $('#promoList');
  if (q.length < 2) { el.innerHTML = `<div class="empty">${promos.length} ${plural(promos.length, 'produkt', 'produkty', 'produktów')} w promocji. Wpisz min. 2 znaki.</div>`; return; }
  const terms = q.split(' ');
  const res = promos.filter(p => { const h = norm(p.brand + ' ' + p.name); return terms.every(t => h.includes(t)); }).slice(0, 60);
  const watched = id => watchlist.some(w => w.id === id);
  el.innerHTML = res.length ? res.map(p => productCard(p, watched(p.id) ? '<span class="icon">✓</span>'
      : `<button class="icon add" data-add="${p.id}" title="Obserwuj">＋</button>`)).join('')
    : '<div class="empty">Nic nie znaleziono w aktualnych promocjach.<br>Możesz dodać to w „Moje” — dam znać, jak wejdzie.</div>';
}
function render() { renderMine(); renderPromos(); }

// ---- events ----
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  $('#tab-mine').hidden = b.dataset.tab !== 'mine';
  $('#tab-promos').hidden = b.dataset.tab !== 'promos';
});
$('#gear').onclick = () => { const s = $('#settings'); s.style.display = s.style.display === 'block' ? 'none' : 'block'; };
$('#saveSettings').onclick = async () => {
  LS.set('token', $('#token').value.trim()); LS.set('repo', $('#repo').value.trim());
  $('#settings').style.display = 'none'; await loadWatchlist(); render(); toast('Ustawienia zapisane');
};
$('#addBtn').onclick = () => { const it = parseInput($('#addInput').value); if (it) { $('#addInput').value = ''; addItem(it); } };
$('#addInput').onkeydown = e => { if (e.key === 'Enter') $('#addBtn').click(); };
$('#search').oninput = renderPromos;
document.body.addEventListener('click', e => {
  const a = e.target.closest('[data-add]'), d = e.target.closest('[data-del]');
  if (a) { const p = promos.find(x => x.id === Number(a.dataset.add)); addItem({ id: p.id, label: `${p.brand} ${p.name} ${p.unit}`.trim() }); }
  if (d) removeItem(Number(d.dataset.del));
});

// ---- init ----
(async () => {
  $('#token').value = token(); $('#repo').value = repo();
  try {
    const data = await fetch('promos.json', { cache:'no-store' }).then(r => r.json());
    promos = data.items || [];
    $('#updated').textContent = 'Aktualizacja: ' + new Date(data.updatedAt).toLocaleString('pl-PL', { dateStyle:'short', timeStyle:'short' });
  } catch { $('#updated').textContent = 'Brak danych o promocjach'; }
  await loadWatchlist();
  if (!token()) $('#settings').style.display = 'block';
  render();
})();
</script>
</body>
</html>

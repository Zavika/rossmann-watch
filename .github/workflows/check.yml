name: rossmann-check

on:
  schedule:
    - cron: '17 6 * * *'   # daily at 06:17 UTC = 7:17 Warsaw in winter, 8:17 in summer
  workflow_dispatch:
  push:
    branches: [main]
    paths: [watchlist.json, index.html, check.mjs, .github/workflows/check.yml]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rossmann-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scan promotions + notify
        run: node check.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Save notification state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "update state"
            git pull --rebase
            git push
          fi

      - name: Build site
        run: cp index.html site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
